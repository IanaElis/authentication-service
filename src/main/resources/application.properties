#JWT secrets
mp.jwt.verify.publickey.location=public.pem
mp.jwt.private-key.location=private.pem
quarkus.native.resources.includes=public.pem
mp.jwt.verify.issuer=tu-varna
quarkus.http.port=8080

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Cookie,Accept
quarkus.http.cors.exposed-headers=Content-Type,Set-Cookie
quarkus.http.cors.access-control-allow-credentials=true


quarkus.log.level=TRACE


#Database configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5442/alumni_auth_service
quarkus.datasource.username=postgres
quarkus.datasource.password=alumni
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.schema-management=none

#quarkus.oidc.enabled=true
#quarkus.oidc.application-type=web-app
#quarkus.oidc.tenant-enabled=true

quarkus.http.auth.form.enabled=false
quarkus.smallrye-jwt.enabled=true

mp.jwt.token.cookie=Authorization
mp.jwt.token.header=Cookie


quarkus.rest-client.user-service.url=http://localhost:8082

quarkus.rest-client.moderation-service.url=http://localhost:8083

